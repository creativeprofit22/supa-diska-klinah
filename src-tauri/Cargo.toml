[package]
name = "supa-diska-klinah"
version = "0.1.0"
description = "Windows-first disk cleanup desktop foundation"
authors = ["Supa Diska Klinah contributors"]
edition = "2024"
rust-version = "1.90"
license = "MIT"
default-run = "supa-diska-klinah"

[lib]
name = "supa_diska_klinah_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
windows-platform = { path = "crates/windows-platform" }

[workspace]
members = [
  "crates/cleanup-core",
  "crates/privileged-helper",
  "crates/windows-platform",
]
resolver = "2"
