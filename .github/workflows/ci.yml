name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show
        working-directory: src-tauri

      - name: Check immutable dependency pins
        run: pnpm check:dependencies

      - name: Check Kudu parity contract
        run: pnpm check:parity

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Check Windows and Tauri security boundaries
        run: pnpm check:security

      - name: Check documentation links
        run: pnpm check:docs

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Prepare privileged helper for Clippy
        run: pnpm build:helper -- --target x86_64-pc-windows-msvc
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          TAURI_ENV_DEBUG: "true"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: Test Rust workspace
        run: cargo test --workspace --locked
        working-directory: src-tauri

  native-smoke:
    name: Native smoke (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show
        working-directory: src-tauri

      - name: Build native debug executable
        run: pnpm tauri build --debug --no-bundle --target ${{ matrix.target }}

      - name: Launch native executable as standard user
        shell: pwsh
        run: ./scripts/smoke-native-ci.ps1 -Target ${{ matrix.target }}

  windows-release:
    name: Signed Windows release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    environment: windows-release
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show
        working-directory: src-tauri

      - name: Import protected code-signing certificate
        shell: pwsh
        run: ./scripts/prepare-windows-signing.ps1
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}

      - name: Build signed per-machine NSIS bundle
        shell: pwsh
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config $env:TAURI_RELEASE_CONFIG

      - name: Verify signed installed release
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1

      - name: Remove imported signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
