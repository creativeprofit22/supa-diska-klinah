name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show
        working-directory: src-tauri

      - name: Check Kudu parity contract
        run: pnpm check:parity

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: Test Rust workspace
        run: cargo test --workspace --locked
        working-directory: src-tauri

  native-smoke:
    name: Native smoke (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - architecture: ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        # actions/checkout v4.2.2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show
        working-directory: src-tauri

      - name: Build native debug executable
        run: pnpm tauri build --debug --no-bundle --target ${{ matrix.target }}

      - name: Launch native executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/${{ matrix.target }}/debug/supa-diska-klinah.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Native executable exited during the smoke window with code $($process.ExitCode)."
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              Wait-Process -Id $process.Id
            }
          }
